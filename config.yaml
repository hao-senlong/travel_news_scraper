# ─────────────────────────────────────────────────────────────
#  TourAZ watcher – settings you are likely to edit
# ─────────────────────────────────────────────────────────────

# Short description of the company, used by the (optional) AI filter.
# The more specific, the better the filtering.
company_profile: >
  We are a travel / DMC company working with Korea. We are interested in
  (1) anything concerning Russia, CIS countries (Kazakhstan, Uzbekistan,
  Kyrgyzstan, Tajikistan, Turkmenistan, Azerbaijan, Armenia, Georgia, Belarus,
  Moldova) and Spanish-speaking markets (Spain, Mexico, Latin America);
  (2) MICE – conferences, incentives, exhibitions, unique venues, MICE bureaus;
  (3) medical and wellness tourism;
  (4) sports tourism – especially cycling, running/marathons and athletics,
  but other sports events, training camps and sports travel products too.
  We care about calls for participants, sales calls/roadshows abroad,
  fam trips, subsidies for travel agencies, fairs and events we could join.

# Language the memo is written in (only used when the AI filter is on).
memo_language: English

# Which board tabs to scan and how many pages of each (16 posts per page).
#  ktoip = "투어라즈 공모" (KTO's own calls – the link you were given)
#  other = "유관기관 공모" (regional tourism bodies, ~25 posts/week)
tabs:
  ktoip: 4
  other: 5

# Send an email even when nothing relevant was found ("nothing new" note)?
send_when_empty: false

# AI model (only used if ANTHROPIC_API_KEY is set). Haiku = cheapest.
llm_model: claude-haiku-5-5

# ─────────────────────────────────────────────────────────────
